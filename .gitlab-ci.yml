stages:
  - deploy

deploy-local:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DEPLOY_MODE: swarm
    STACK_NAME: cheersai
  before_script:
    - apk add --no-cache bash
    - test -n "${ENCRYPTION_KEY}"
    - |
      if [ -n "${HARBOR_REGISTRY}" ] && [ -n "${HARBOR_USERNAME}" ] && [ -n "${HARBOR_PASSWORD}" ]; then
        docker login "${HARBOR_REGISTRY}" -u "${HARBOR_USERNAME}" -p "${HARBOR_PASSWORD}"
      fi
    - chmod +x scripts/deploy-local.sh
  script:
    - ./scripts/deploy-local.sh "${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
  rules:
    - if: '$CI_COMMIT_BRANCH'
