<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键同步 FileBay 配置</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        
        .step {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
        
        .step h3 {
            margin-top: 0;
            color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
            transition: transform 0.2s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .result {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 20px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .success {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        
        .error {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        
        .info {
            background: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .config-display {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }
        
        .config-item {
            margin: 8px 0;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 4px;
        }
        
        .config-label {
            font-weight: bold;
            color: #667eea;
            display: inline-block;
            width: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 一键同步 FileBay 配置</h1>
        
        <div class="step">
            <h3>📋 使用说明</h3>
            <p>1. 确保你已经在 Vault 系统中登录（http://localhost:3000）</p>
            <p>2. 点击下面的"开始同步"按钮</p>
            <p>3. 系统会自动获取配置并同步到 Vault 数据库</p>
        </div>
        
        <button onclick="syncConfig()" id="syncBtn">🚀 开始同步</button>
        
        <div id="result"></div>
    </div>

    <script>
        async function syncConfig() {
            const resultDiv = document.getElementById('result');
            const syncBtn = document.getElementById('syncBtn');
            
            syncBtn.disabled = true;
            resultDiv.innerHTML = '<div class="result info"><span class="loading"></span>正在同步配置...</div>';
            
            const logs = [];
            
            try {
                // 步骤 1: 获取用户信息
                logs.push('📝 步骤 1: 获取用户信息...');
                resultDiv.innerHTML = '<div class="result info">' + logs.join('\n') + '</div>';
                
                const userResponse = await fetch('http://localhost:5001/console/api/account/profile', {
                    credentials: 'include'
                });
                
                if (!userResponse.ok) {
                    throw new Error('未登录或会话过期。请先登录: http://localhost:3000/signin');
                }
                
                const user = await userResponse.json();
                logs.push(`✓ 用户信息获取成功`);
                logs.push(`  - ID: ${user.id}`);
                logs.push(`  - 邮箱: ${user.email}`);
                logs.push(`  - 姓名: ${user.name}`);
                resultDiv.innerHTML = '<div class="result info">' + logs.join('\n') + '</div>';
                
                // 步骤 2: 获取 FileBay 配置
                logs.push('\n📝 步骤 2: 获取 FileBay 配置...');
                resultDiv.innerHTML = '<div class="result info">' + logs.join('\n') + '</div>';
                
                const configResponse = await fetch('http://localhost:5001/console/api/gitea/config/download', {
                    credentials: 'include'
                });
                
                if (!configResponse.ok) {
                    throw new Error('获取 FileBay 配置失败');
                }
                
                const config = await configResponse.json();
                logs.push(`✓ FileBay 配置获取成功`);
                logs.push(`  - URL: ${config.gitea_url}`);
                logs.push(`  - 用户名: ${config.gitea_owner}`);
                logs.push(`  - 仓库: ${config.gitea_repo}`);
                logs.push(`  - Token: ${config.gitea_token.substring(0, 20)}...`);
                resultDiv.innerHTML = '<div class="result info">' + logs.join('\n') + '</div>';
                
                // 步骤 3: 检查 Vault Bridge
                logs.push('\n📝 步骤 3: 检查 Vault Bridge...');
                resultDiv.innerHTML = '<div class="result info">' + logs.join('\n') + '</div>';
                
                const healthResponse = await fetch('http://localhost:8765/health');
                
                if (!healthResponse.ok) {
                    throw new Error('Vault Bridge 未运行。请启动: .\\start_vault_bridge.ps1');
                }
                
                const health = await healthResponse.json();
                logs.push(`✓ Vault Bridge 运行正常`);
                logs.push(`  - 版本: ${health.version}`);
                logs.push(`  - 数据库: ${health.database}`);
                resultDiv.innerHTML = '<div class="result info">' + logs.join('\n') + '</div>';
                
                // 步骤 4: 同步配置
                logs.push('\n📝 步骤 4: 同步配置到 Vault 数据库...');
                resultDiv.innerHTML = '<div class="result info">' + logs.join('\n') + '</div>';
                
                const syncResponse = await fetch('http://localhost:8765/vault/config/filebay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user.id,
                        config: {
                            url: config.gitea_url,
                            username: config.gitea_owner,
                            repoName: config.gitea_repo,
                            email: user.email,
                            token: config.gitea_token
                        }
                    })
                });
                
                if (!syncResponse.ok) {
                    throw new Error('同步到 Vault 失败');
                }
                
                const syncResult = await syncResponse.json();
                logs.push(`✓ 配置同步成功`);
                logs.push(`  - 用户 ID: ${syncResult.user_id}`);
                logs.push(`  - 用户名: ${syncResult.username}`);
                logs.push(`  - 仓库: ${syncResult.repo_name}`);
                resultDiv.innerHTML = '<div class="result info">' + logs.join('\n') + '</div>';
                
                // 步骤 5: 验证
                logs.push('\n📝 步骤 5: 验证配置已保存...');
                resultDiv.innerHTML = '<div class="result info">' + logs.join('\n') + '</div>';
                
                const verifyResponse = await fetch(`http://localhost:8765/vault/config/filebay/${user.id}`);
                
                if (!verifyResponse.ok) {
                    throw new Error('验证失败：配置未找到');
                }
                
                const savedConfig = await verifyResponse.json();
                logs.push(`✓ 验证成功！配置已保存到 Vault 数据库`);
                logs.push(`  - 更新时间: ${savedConfig.updatedAt}`);
                
                // 成功
                logs.push('\n🎉 同步完成！');
                logs.push('\n下一步：');
                logs.push('1. 重新打开测试页面: file:///E:/CheersAI-Desktop/test_all_methods.html');
                logs.push('2. 点击"测试所有方法"');
                logs.push('3. 方法 1 和方法 2 应该能成功加载配置');
                
                resultDiv.innerHTML = `
                    <div class="result success">${logs.join('\n')}</div>
                    <div class="config-display">
                        <h3>📦 已保存的配置</h3>
                        <div class="config-item">
                            <span class="config-label">URL:</span> ${savedConfig.url}
                        </div>
                        <div class="config-item">
                            <span class="config-label">用户名:</span> ${savedConfig.username}
                        </div>
                        <div class="config-item">
                            <span class="config-label">仓库:</span> ${savedConfig.repoName}
                        </div>
                        <div class="config-item">
                            <span class="config-label">邮箱:</span> ${savedConfig.email}
                        </div>
                        <div class="config-item">
                            <span class="config-label">Token:</span> ${savedConfig.token.substring(0, 20)}...
                        </div>
                        <div class="config-item">
                            <span class="config-label">更新时间:</span> ${new Date(savedConfig.updatedAt).toLocaleString()}
                        </div>
                    </div>
                `;
                
            } catch (error) {
                logs.push(`\n❌ 错误: ${error.message}`);
                logs.push('\n💡 解决方案:');
                
                if (error.message.includes('未登录')) {
                    logs.push('1. 打开 http://localhost:3000/signin');
                    logs.push('2. 使用 Desktop SSO 登录');
                    logs.push('3. 登录成功后，返回此页面重新同步');
                } else if (error.message.includes('Vault Bridge')) {
                    logs.push('1. 打开命令行');
                    logs.push('2. 运行: .\\start_vault_bridge.ps1');
                    logs.push('3. 等待服务启动后，返回此页面重新同步');
                } else {
                    logs.push('1. 检查所有服务是否运行');
                    logs.push('2. 查看浏览器 Console 的详细错误');
                    logs.push('3. 参考 GET_REAL_CONFIG_GUIDE.md 文档');
                }
                
                resultDiv.innerHTML = '<div class="result error">' + logs.join('\n') + '</div>';
            } finally {
                syncBtn.disabled = false;
                syncBtn.textContent = '🔄 重新同步';
            }
        }
    </script>
</body>
</html>
