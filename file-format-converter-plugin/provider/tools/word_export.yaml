identity:
  author: cheersai
  name: export_to_word
  label:
    en_US: Export to Word
    zh_Hans: 导出为Word文档
    zh_CN: 导出为Word文档
  icon: icon.svg
description:
  human:
    en_US: Export conversation content to a Word document (.docx)
    zh_Hans: 将对话内容导出为Word文档(.docx)
    zh_CN: 将对话内容导出为Word文档(.docx)
  llm: >
    A tool that converts markdown text to a Word document (.docx) format. 
    Use this tool when the user wants to save or export the conversation 
    content as a Word document. The input text should be in markdown format.

parameters:
  - name: markdown_content
    type: string
    required: true
    label:
      en_US: Markdown Content
      zh_Hans: Markdown内容
      zh_CN: Markdown内容
    human_description:
      en_US: The markdown content to convert to Word format
      zh_Hans: 要转换为Word格式的Markdown内容
      zh_CN: 要转换为Word格式的Markdown内容
    llm_description: The markdown formatted text content that will be converted to a Word document
    form: llm
  - name: document_name
    type: string
    required: false
    label:
      en_US: Document Name
      zh_Hans: 文档名称
      zh_CN: 文档名称
    human_description:
      en_US: Name for the exported document (without extension)
      zh_Hans: 导出文档的名称（无需扩展名）
      zh_CN: 导出文档的名称（无需扩展名）
    llm_description: Optional name for the output document file, defaults to "document"
    form: form
    default: "document"

extra:
  python:
    source: tools/word_export.py
