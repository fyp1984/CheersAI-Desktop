<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#4F46E5" opacity="0.1"/>
  
  <!-- Main folder icon -->
  <path d="M20 30 L20 70 L80 70 L80 35 L50 35 L45 30 Z" 
        fill="#4F46E5" 
        stroke="#4F46E5" 
        stroke-width="2"/>
  
  <!-- Sync arrows -->
  <g transform="translate(50, 50)">
    <!-- Clockwise arrow -->
    <path d="M 0 -15 A 15 15 0 1 1 -10.6 -10.6" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round"/>
    <path d="M 0 -15 L -3 -10 L 3 -12 Z" 
          fill="#FFFFFF"/>
    
    <!-- Counter-clockwise arrow -->
    <path d="M 0 15 A 15 15 0 1 1 10.6 10.6" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round"/>
    <path d="M 0 15 L 3 10 L -3 12 Z" 
          fill="#FFFFFF"/>
  </g>
</svg>
